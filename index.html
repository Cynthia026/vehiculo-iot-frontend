<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Control IoT - Vehículo</title>

    <link rel="icon" type="image/jpeg" href="assets/Favicon_Iot_vehiculo.jpg">
    <link rel="apple-touch-icon" href="assets/Favicon_Iot_vehiculo.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Encabezado: título y estado de conectividad -->
    <header class="app-header">
        <div class="app-title">
            <span class="app-title-icon"><i class="bi bi-car-front-fill"></i></span>
            <div>
                <h1>Vehículo IoT</h1>
                <small>Unidad 1</small>
            </div>
        </div>
        <div class="status-group">
            <div id="status-wss" class="badge bg-secondary status-badge" title="Estado del WebSocket">
                <i class="bi bi-broadcast"></i> WSS: Desconectado
            </div>
            <div id="status-aws" class="badge bg-secondary status-badge" title="Disponibilidad API REST">
                <i class="bi bi-cloud-check"></i> AWS: Comprobando...
            </div>
            <div id="status-rds" class="badge bg-secondary status-badge" title="Conexión Base de Datos">
                <i class="bi bi-database"></i> RDS: Sin verificar
            </div>
        </div>
    </header>

    <main class="app-main">

        <div id="action-feedback" class="alert alert-info d-none" role="alert">Iniciando...</div>

        <!-- Panel de conducción -->
        <section class="panel drive-panel" aria-label="Conducción">
            <div class="joystick-wrapper">
                <div id="joystick-zone" class="joystick-zone" role="application" aria-label="Joystick de movimiento">
                    <span class="jz-mark jz-up"><i class="bi bi-chevron-up"></i></span>
                    <span class="jz-mark jz-down"><i class="bi bi-chevron-down"></i></span>
                    <span class="jz-mark jz-left"><i class="bi bi-chevron-left"></i></span>
                    <span class="jz-mark jz-right"><i class="bi bi-chevron-right"></i></span>
                    <div id="joystick-knob" class="joystick-knob">
                        <i class="bi bi-arrows-move"></i>
                    </div>
                </div>
                <p class="joystick-hint"><i class="bi bi-hand-index-thumb"></i> Arrastra para mover</p>
            </div>

            <button id="btn-stop" class="btn-stop" disabled>
                <i class="bi bi-sign-stop-fill"></i> Detener
            </button>
        </section>

        <!-- Comandos y secuencias -->
        <div class="side-column">
            <section class="panel" aria-label="Comandos">
                <h2 class="panel-title"><i class="bi bi-grid-fill"></i> Comandos</h2>
                <div id="extra-commands-container" class="commands-grid">
                    <div class="commands-loading" id="cmds-loading">Conectando con AWS...</div>
                </div>
            </section>

            <section class="panel" aria-label="Secuencias demo">
                <h2 class="panel-title"><i class="bi bi-play-circle-fill"></i> Secuencias demo</h2>
                <select id="demo-select" class="form-select demo-select" aria-label="Seleccionar demo">
                    <option value="" selected>Cargando demos...</option>
                </select>
                <div class="demo-actions">
                    <button id="btn-demo-start" class="btn-demo btn-demo-start" disabled>
                        <i class="bi bi-play-fill"></i> Iniciar
                    </button>
                    <button id="btn-demo-cancel" class="btn-demo btn-demo-cancel" disabled>
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>
                </div>
            </section>
        </div>
    </main>

    <footer class="app-footer">
        Desarrollado por Cynthia Martínez García &middot; 2026
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
