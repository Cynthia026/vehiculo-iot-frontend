<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control IoT - Vehículo</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="assets/Favicon_Iot_vehiculo.jpg">
    <link rel="apple-touch-icon" href="assets/Favicon_Iot_vehiculo.jpg">
    
    <!-- Bootstrap 5 CSS y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Hoja de Estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Header: Panel de Conectividad -->
    <header class="bg-dark text-white p-2 shadow-sm sticky-top">
        <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center">
            <h1 class="h6 mb-0 py-1"><i class="bi bi-car-front-fill me-2 text-info"></i>Vehículo IoT [1]</h1>
            <div class="d-flex gap-2 text-center flex-wrap justify-content-end">
                <div id="status-wss" class="badge bg-secondary border border-light status-badge" title="Estado del WebSocket">
                    <i class="bi bi-broadcast"></i> WSS: Desconectado
                </div>
                <div id="status-aws" class="badge bg-secondary border border-light status-badge" title="Disponibilidad API REST">
                    <i class="bi bi-cloud-check"></i> AWS: Comprobando...
                </div>
                <div id="status-rds" class="badge bg-secondary border border-light status-badge" title="Conexión Base de Datos">
                    <i class="bi bi-database"></i> RDS: Sin verificar
                </div>
            </div>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="container-fluid flex-grow-1 d-flex flex-column py-3">
        
        <div id="action-feedback" class="alert alert-info max-w-sm w-100 text-center mx-auto mb-3 shadow-sm d-none" role="alert">
            Iniciando...
        </div>

        <!-- Joystick -->
        <div class="joystick-wrapper mb-4">
            <div id="joystick-zone" class="joystick-zone">
                <div id="joystick-knob" class="joystick-knob">
                    <i class="bi bi-arrows-move"></i>
                </div>
            </div>
            <p class="text-center text-muted mt-3 small fw-bold"><i class="bi bi-hand-index-thumb"></i> ARRASTRA PARA MOVER</p>
        </div>

        <!-- Controles Secundarios y DEMO -->
        <div class="max-w-sm w-100 mx-auto px-2">
            <button id="btn-stop" class="btn btn-danger btn-lg w-100 shadow-sm fw-bold mb-4 py-3" disabled>
                <i class="bi bi-sign-stop-fill me-2"></i>DETENER
            </button>

            <h6 class="text-secondary mb-2 fw-bold" style="font-size: 0.85rem;"><i class="bi bi-grid-fill me-1"></i> CATÁLOGO DE COMANDOS</h6>
            <div class="row g-2 mb-4" id="extra-commands-container">
                <div class="col-12 text-center text-muted small" id="cmds-loading">Conectando con AWS...</div>
            </div>

            <!-- DEMO -->
            <div class="card shadow-sm border-0 bg-white mb-3">
                <div class="card-body p-3">
                    <h6 class="card-title text-secondary mb-3 fw-bold" style="font-size: 0.85rem;"><i class="bi bi-play-circle-fill me-1"></i> SECUENCIAS DEMO</h6>
                    <select id="demo-select" class="form-select mb-3 bg-light" aria-label="Seleccionar DEMO">
                        <option value="" selected>Cargando DEMOs...</option>
                    </select>
                    <div class="d-flex gap-2">
                        <button id="btn-demo-start" class="btn btn-success flex-grow-1 fw-medium" disabled>
                            <i class="bi bi-play-fill"></i> Iniciar
                        </button>
                        <button id="btn-demo-cancel" class="btn btn-outline-danger flex-grow-1 fw-medium" disabled>
                            <i class="bi bi-x-circle"></i> Cancelar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-3 border-top mt-auto shadow-sm">
        <div class="container text-muted fw-medium" style="font-size: 0.85rem;">
            Desarrollado por Cynthia Martínez García &middot; 2026<br>
            <span class="text-secondary" style="font-size: 0.70rem;">Control IoT - Interfaz de Operación</span>
        </div>
    </footer>

    <!-- Importación del módulo principal JS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
